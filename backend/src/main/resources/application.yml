spring:
  application:
    name: securedocs
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/securedocs}
    username: ${DB_USER:securedocs}
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

securedocs:
  zona-horaria: America/Lima
  proxy-confiable: false
  mostrar-detalle-denegacion: false
